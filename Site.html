<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>രുചിക്കൂട്ട് · Ruchikkoottu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;700&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCEC;--card:#fff;--ink:#2a2418;--mut:#6b6250;--g:#2E7D1E;--o:#E26A00;--b:#8B3A12;--line:#e8dfc0;--leaf:#e4f1d4;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15170e;--card:#1f2315;--ink:#f3efdc;--mut:#b9b39b;--g:#7fcf63;--o:#ff9a3d;--b:#e0a27d;--line:#33381f;--leaf:#1d2a14;--on:#15170e}}
:root[data-theme="dark"]{--bg:#15170e;--card:#1f2315;--ink:#f3efdc;--mut:#b9b39b;--g:#7fcf63;--o:#ff9a3d;--b:#e0a27d;--line:#33381f;--leaf:#1d2a14;--on:#15170e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manjari,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Baloo Chettan 2",Manjari,sans-serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:1.8rem}h3{font-size:1.2rem}
p{margin:0 0 .8em}.mut{color:var(--mut)}.sm{font-size:.88rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px}
header img{height:42px;border-radius:8px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem}
nav a.on{background:var(--g);color:var(--on)}
.cartb{border:2px solid var(--o);background:none;color:var(--o);border-radius:10px;padding:5px 12px;font:700 .92rem Manjari;cursor:pointer;white-space:nowrap}
.w{max-width:1040px;margin:0 auto;padding:24px 16px}
.hero{display:grid;gap:28px;align-items:center;grid-template-columns:1fr}
@media(min-width:760px){.hero{grid-template-columns:5fr 6fr}}
.logo{background:#FFFCEC;border-radius:28px;padding:12px;border:2px solid var(--line)}.logo img{width:100%;display:block}
.band{background:var(--leaf);border-radius:48px 48px 0 0;margin-top:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.em{width:54px;height:54px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;font-size:1.7rem}
.price{font:700 1.3rem "Baloo Chettan 2";color:var(--b)}.price s{font-size:.9rem;color:var(--mut);margin-right:6px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--leaf);color:var(--g);font-weight:700;font-size:.8rem}
.pill.r{background:#fde3cf;color:#9a3d00}
.btn{border:0;border-radius:10px;padding:9px 16px;font:700 .95rem Manjari;cursor:pointer;background:var(--o);color:#fff;margin-top:auto}
.btn.g{background:var(--g);color:var(--on)}.btn.l{background:none;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 14px;font:700 .88rem Manjari;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:1rem Manjari}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;gap:4px;align-items:center;font-weight:400;margin:0}.days input{width:auto}
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{padding:8px 0 8px 36px;position:relative;color:var(--mut)}
.steps li::before{content:"";position:absolute;left:6px;top:12px;width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.steps li.d{color:var(--ink);font-weight:700}.steps li.d::before{background:var(--g);border-color:var(--g)}
.note{border-left:4px solid var(--o);padding:6px 12px;background:var(--card);border-radius:0 10px 10px 0}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px}
.stat b{display:block;font:700 1.7rem "Baloo Chettan 2";color:var(--g)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.s{opacity:1}
footer{text-align:center;padding:24px 16px;color:var(--mut);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<h1>Homemade meals from kitchens down your street.</h1>
<p class="mut">Your neighbourhood. Their kitchen. Your homemade happiness. Order today’s meal, follow your favourite cooks, or set up a weekly lunch.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a href="#kitchen"><button class="btn">See today’s kitchen</button></a><a href="#plans"><button class="btn g">Plan weekly lunches</button></a></div>
<p class="sm mut" style="margin-top:14px">Starting in a small area of Thrissur.</p></div></div>
<div class="band" id="kitchen"><div class="w"><h2>Today’s Kitchen</h2><p class="mut">What your neighbours are cooking today. Reserve before the portions run out.</p>
<div class="chips">${ch('diet','all','All')}${ch('diet','veg','Vegetarian')}${ch('diet','non','Non-veg')}${ch('sort','price','Lowest price')}${ch('sort','dist','Nearest')}${F.cook?ch('cook','','Clear cook: '+C[F.cook].n):''}</div>
<div class="grid">${l.map(dish).join('')||'<p>No meals match. Clear a filter to see more.</p>'}</div></div></div>
<div class="w"><h2>How it works</h2><div class="grid">
<div class="card"><h3>1. Pick</h3>Browse today’s dishes and cooks near you.</div>
<div class="card"><h3>2. Reserve</h3>Reserve a portion, or subscribe to weekly meals.</div>
<div class="card"><h3>3. Receive</h3>A delivery partner brings it. Follow the status live.</div></div></div>`},
cooks(){return `<div class="w"><h2>Neighbourhood cooks</h2><p class="mut">Approved home cooks near you, with their delivery radius.</p><div class="grid">
${Object.entries(C).sort((a,b)=>a[1].d-b[1].d).map(([k,c])=>`<div class="card"><h3>${c.n}</h3><div><span class="pill">★ ${c.r} · ${c.k} reviews</span> <span class="pill">${c.d} km</span></div>
<div class="sm"><b>Speciality:</b> ${c.sp}</div><p class="sm mut">“${c.st}”</p><div class="sm mut">Delivers within ${c.rad} km · Food-safety credentials shown on profile</div>
<button class="btn g" onclick="F.cook='${k}';location.hash='home'">See today’s menu</button></div>`).join('')}</div></div>`},
plans(){const T=[['Student plan','Affordable weekday lunches for hostel students',100],['Office plan','Scheduled weekday meals at your workplace',120],['Family plan','Multiple portions for the household',300]];
return `<div class="w"><h2>My Daily Oonu</h2><p class="mut">A regular homemade lunch, without ordering every morning. Sample prices, per day.</p>
<div class="grid">${T.map(t=>`<div class="card"><h3>${t[0]}</h3><p class="sm mut">${t[1]}</p><div class="price">${rs(t[2])}/day</div><button class="btn g" onclick="$('#pn').value='${t[0]}';$('#pn').scrollIntoView({behavior:'smooth'})">Choose</button></div>`).join('')}</div>
<div class="card" style="margin-top:18px;max-width:560px"><h3>Set up your plan</h3>
<label for="pn">Plan</label><select id="pn">${T.map(t=>`<option>${t[0]}</option>`).join('')}</select>
<label for="pc">Cook</label><select id="pc">${Object.entries(C).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('')}</select>
<label>Days</label><div class="days">${['Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label><input type="checkbox" value="${d}" ${i<5?'checked':''}>${d}</label>`).join('')}</div>
<label for="pd">Diet</label><select id="pd"><option>Vegetarian</option><option>Non-vegetarian</option><option>Less spicy</option></select>
<label for="pt">Delivery time</label><select id="pt"><option>12:00 PM</option><option>12:30 PM</option><option>1:00 PM</option></select>
<p class="sm mut" style="margin-top:10px">Backup cook: if your cook can’t deliver, we offer another cook. You approve the swap.</p>
<button class="btn" onclick="startPlan()">Start plan</button></div>
${plans.length?`<h3 style="margin-top:20px">Your plans</h3>`+plans.map((p,i)=>`<div class="row"><span><b>${p.n}</b> · ${C[p.c].n}<br><span class="sm mut">${p.d} · ${p.t} · ${p.v}</span></span><button class="btn l" onclick="plans[${i}].on=!plans[${i}].on;render()">${p.on?'Pause':'Resume'}</button></div>`).join(''):''}</div>`},
surplus(){return `<div class="w"><h2>Zero-Waste Kitchen</h2><p class="mut">Safe surplus portions at a lower price, so good food isn’t thrown away.</p>
<div class="note sm">Only food that was prepared, stored and handled safely is listed. Each listing shows when it was made and when it expires.</div><br>
<div class="grid">${D.filter(x=>x.s).map(dish).join('')}</div></div>`},
cart(){const t=cart.reduce((a,c)=>a+c.q*D.find(d=>d.id==c.id).p,0);
if(!cart.length)return `<div class="w"><h2>Your cart is empty</h2><p>Reserve a meal from <a href="#home">Today’s Kitchen</a> to get started.</p></div>`;
return `<div class="w" style="max-width:600px"><h2>Cart</h2>${cart.map(c=>{const x=D.find(d=>d.id==c.id);return `<div class="row"><span>${x.n} × ${c.q}<br><span class="sm mut">${C[x.c].n}</span></span><b>${rs(x.p*c.q)}</b></div>`}).join('')}
<div class="row"><span>Delivery (sample fee)</span><b>${rs(20)}</b></div><div class="row"><b>Total</b><b class="price">${rs(t+20)}</b></div>
<label for="nm">Name</label><input id="nm" value="Arun"><label for="ad">Delivery address</label><input id="ad" placeholder="Hostel or home address">
<label for="py">Payment (simulated)</label><select id="py"><option>UPI</option><option>Cash on delivery</option></select>
<button class="btn" style="margin-top:14px" onclick="place(${t+20})">Place order</button></div>`},
track(){if(!orders.length)return `<div class="w"><h2>No orders yet</h2><p>Your orders and their delivery status appear here. Start in <a href="#home">Today’s Kitchen</a>.</p></div>`;
return `<div class="w" style="max-width:600px"><h2>My orders</h2>${orders.map((o,i)=>`<div class="card" style="margin-bottom:14px"><b>Order #${o.id}</b> · ${rs(o.t)}<div class="sm mut">${o.items}</div>
<ul class="steps">${STEPS.map((s,j)=>`<li class="${j<=o.s?'d':''}">${s}</li>`).join('')}</ul>
<button class="btn l" ${o.s>3?'disabled':''} onclick="orders[${i}].s++;render()">Demo: move to next status</button></div>`).join('')}</div>`},
dash(){return `<div class="w"><h2>Cook dashboard</h2><p class="mut">Anitha’s Kitchen · sample data</p>
<div class="stats"><div class="card stat"><b>${Q.length}</b>Orders today</div><div class="card stat"><b>${D[0].l}</b>Portions left</div><div class="card stat"><b>5</b>Active subscriptions</div></div>
<h3>Incoming orders</h3>${Q.map((q,i)=>`<div class="row"><span><b>${q.n}</b> · ${q.m}<br><span class="sm mut">${q.s}</span></span><span>${q.s=='New'?`<button class="btn g" onclick="Q[${i}].s='Accepted';render()">Accept</button> <button class="btn l" onclick="Q[${i}].s='Rejected';render()">Reject</button>`:''}</span></div>`).join('')}
<div class="card" style="margin-top:20px;max-width:520px"><h3>Earnings calculator</h3>
<label for="q">Meals sold</label><input id="q" type="number" value="20" oninput="calc()"><label for="pr">Price per meal (₹)</label><input id="pr" type="number" value="120" oninput="calc()">
<label for="ic">Ingredients per meal (₹)</label><input id="ic" type="number" value="55" oninput="calc()"><label for="pk">Packaging per meal (₹)</label><input id="pk" type="number" value="5" oninput="calc()">
<div id="out" class="note" style="margin-top:12px"></div><p class="sm mut">Sample 10% platform commission. Delivery is accounted for separately.</p></div></div>`},
admin(){return `<div class="w"><h2>Admin</h2><h3>Cook applications</h3>${AP.map((a,i)=>`<div class="row"><span><b>${a.n}</b><br><span class="sm mut">${a.s}</span></span><span>${a.s=='Pending'?`<button class="btn g" onclick="AP[${i}].s='Approved';render()">Approve</button> <button class="btn l" onclick="AP[${i}].s='Rejected';render()">Reject</button>`:''}</span></div>`).join('')}
<h3 style="margin-top:20px">Complaints</h3>${CM.map((c,i)=>`<div class="row"><span>${c.m}<br><span class="sm mut">${c.s}</span></span>${c.s=='Open'?`<button class="btn g" onclick="CM[${i}].s='Resolved';render()">Resolve</button>`:''}</div>`).join('')}
<h3 style="margin-top:20px">Live listings</h3><p class="mut">${D.filter(x=>x.l).length} dishes available across ${Object.keys(C).length} approved cooks.</p></div>`}};
function startPlan(){const d=[...document.querySelectorAll('.days input:checked')].map(i=>i.value);if(!d.length)return toast('Pick at least one day');
plans.push({n:$('#pn').value,c:$('#pc').value,d:d.join(', '),t:$('#pt').value,v:$('#pd').value,on:1});render();toast('Plan started')}
function place(t){if(!$('#ad').value.trim())return toast('Enter a delivery address');
orders.unshift({id:1042+orders.length+1,t,s:0,items:cart.map(c=>{const x=D.find(d=>d.id==c.id);return x.n+' × '+c.q}).join(', ')});cart=[];upd();location.hash='track';toast('Order placed')}
function calc(){const g=+$('#q').value*+$('#pr').value,c=+$('#q').value*(+$('#ic').value+ +$('#pk').value),f=g*.1;
$('#out').innerHTML=`Gross sales: <b>${rs(g)}</b><br>Ingredients and packaging: ${rs(c)}<br>Platform commission: ${rs(f)}<br>Estimated earnings: <b>${rs(g-c-f)}</b>`}
function render(){let h=location.hash.slice(1)||'home';if(h=='kitchen')h='home';if(!V[h])h='home';
$('#v').innerHTML=V[h]();$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==h?'on':''}">${n[1]}</a>`).join('');if(h=='dash')calc();
if(location.hash=='#kitchen')$('#kitchen').scrollIntoView()}
addEventListener('hashchange',()=>{render();if(location.hash!='#kitchen')scrollTo(0,0)});render();
</script></body></html>
