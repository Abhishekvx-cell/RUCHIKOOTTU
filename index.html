!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>രുചിക്കൂട്ട് · Ruchikkoottu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;700&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCEC;--card:#fff;--ink:#2a2418;--mut:#6b6250;--g:#2E7D1E;--o:#E26A00;--b:#8B3A12;--line:#e8dfc0;--leaf:#e4f1d4;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15170e;--card:#1f2315;--ink:#f3efdc;--mut:#b9b39b;--g:#7fcf63;--o:#ff9a3d;--b:#e0a27d;--line:#33381f;--leaf:#1d2a14;--on:#15170e}}
:root[data-theme="dark"]{--bg:#15170e;--card:#1f2315;--ink:#f3efdc;--mut:#b9b39b;--g:#7fcf63;--o:#ff9a3d;--b:#e0a27d;--line:#33381f;--leaf:#1d2a14;--on:#15170e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manjari,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Baloo Chettan 2",Manjari,sans-serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:1.8rem}h3{font-size:1.2rem}
p{margin:0 0 .8em}.mut{color:var(--mut)}.sm{font-size:.88rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px}
header img{height:42px;border-radius:8px;background:#fff}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem}
nav a.on{background:var(--g);color:var(--on)}
.cartb{border:2px solid var(--o);background:none;color:var(--o);border-radius:10px;padding:5px 12px;font:700 .92rem Manjari;cursor:pointer;white-space:nowrap}
.w{max-width:1040px;margin:0 auto;padding:24px 16px}
.hero{display:grid;gap:28px;align-items:center;grid-template-columns:1fr}
@media(min-width:760px){.hero{grid-template-columns:5fr 6fr}}
.logo{background:#fff;border-radius:28px;padding:12px;border:2px solid var(--line)}.logo img{width:100%;display:block}
.band{background:var(--leaf);border-radius:48px 48px 0 0;margin-top:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.em{width:54px;height:54px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;font-size:1.7rem}
.price{font:700 1.3rem "Baloo Chettan 2";color:var(--b)}.price s{font-size:.9rem;color:var(--mut);margin-right:6px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--leaf);color:var(--g);font-weight:700;font-size:.8rem}
.pill.r{background:#fde3cf;color:#9a3d00}
.ph{width:100%;height:140px;object-fit:cover;border-radius:12px;display:block}
.btn{border:0;border-radius:10px;padding:9px 16px;font:700 .95rem Manjari;cursor:pointer;background:var(--o);color:#fff;margin-top:auto}
.btn.g{background:var(--g);color:var(--on)}.btn.l{background:none;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 14px;font:700 .88rem Manjari;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:1rem Manjari}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;gap:4px;align-items:center;font-weight:400;margin:0}.days input{width:auto}
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{padding:8px 0 8px 36px;position:relative;color:var(--mut)}
.steps li::before{content:"";position:absolute;left:6px;top:12px;width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.steps li.d{color:var(--ink);font-weight:700}.steps li.d::before{background:var(--g);border-color:var(--g)}
.note{border-left:4px solid var(--o);padding:6px 12px;background:var(--card);border-radius:0 10px 10px 0}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px}
.stat b{display:block;font:700 1.7rem "Baloo Chettan 2";color:var(--g)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.s{opacity:1}
footer{text-align:center;padding:24px 16px;color:var(--mut);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
